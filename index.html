<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>203 Tools</title>
<style>
  :root{
    --bg:#fafaf9; --surface:#ffffff; --ink:#1c1c1a; --muted:#6b6b66; --border:#dcdcd6; --accent:#2a6fdb;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#141416; --surface:#1d1d20; --ink:#ececea; --muted:#9a9a94; --border:#35353a; --accent:#6aa3ff; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
  main{max-width:720px;margin:0 auto;padding:48px 16px}
  h1{font-size:28px;margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 28px}
  ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}
  a.tool{display:block;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;text-decoration:none;color:inherit}
  a.tool:hover,a.tool:focus-visible{border-color:var(--accent);outline:none}
  .name{font-weight:600;color:var(--accent)}
  .desc{color:var(--muted);font-size:14px;margin-top:2px}
</style>
</head>
<body>
<main>
  <h1>203 Tools</h1>
  <p class="sub">A small collection of web tools.</p>

  <ul>
    <li>
      <a class="tool" href="pingalyzer.html">
        <div class="name">Pingalyzer</div>
        <div class="desc">Live latency to Google, Cloudflare and Bing, with a 30-second chart and session max.</div>
      </a>
    </li>
    <li>
      <a class="tool" href="stocks.html">
        <div class="name">Stock Watchlist</div>
        <div class="desc">Track quotes for NVDA, SPCX, ANT, DUOL, BG and ADM. Add or remove tickers; live prices with a free Finnhub key.</div>
      </a>
    </li>
    <!-- Add new tools by copying the <li> above. -->
  </ul>
</main>
</body>
</html>
